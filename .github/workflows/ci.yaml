name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            prepare: true
          - os: macos-15
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare datatool (linux only)
        if: matrix.prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar
          make prepare

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w" -o tdx2db${{ matrix.ext }} ./main.go

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tdx2db${{ matrix.ext }}
          retention-days: 7

  build-on-rocky:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: rockylinux:9
      options: --user root
    env:
      CGO_ENABLED: "1"
      CC: gcc
      CXX: g++
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap Rocky
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git ca-certificates tar gzip curl-minimal bsdtar

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Prepare datatool
        run: |
          mkdir -p .tmp/extracted tdx/embed
          curl -fsSL \
            https://www.tdx.com.cn/products/autoup/cyb/datatool.rar \
            -o .tmp/datatool.rar
          bsdtar -xf .tmp/datatool.rar -C .tmp/extracted
          install -m 0755 .tmp/extracted/v4/datatool tdx/embed/datatool

      - name: Verify toolchain
        run: |
          go version
          gcc --version | head -1
          ldd --version | head -1

      - name: Test
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Build
        run: |
          go build -trimpath -ldflags="-s -w" -o tdx2db .
          ./tdx2db version
          ldd ./tdx2db

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-linux-arm64-rocky9
          path: tdx2db
          retention-days: 7
