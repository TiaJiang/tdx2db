name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            os_title: Linux
            arch_title: x86_64
            ext: ""
            archive: tar.gz
            prepare: true
          - os: macos-15
            goos: darwin
            goarch: arm64
            os_title: Darwin
            arch_title: arm64
            ext: ""
            archive: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            os_title: Windows
            arch_title: x86_64
            ext: ".exe"
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare datatool (linux only)
        if: matrix.prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar
          make prepare

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
            -o tdx2db${{ matrix.ext }} ./main.go

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="tdx2db_${{ matrix.os_title }}_${{ matrix.arch_title }}"
          tar -czf "${NAME}.tar.gz" tdx2db${{ matrix.ext }}

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          NAME="tdx2db_${{ matrix.os_title }}_${{ matrix.arch_title }}"
          7z a "${NAME}.zip" tdx2db${{ matrix.ext }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tdx2db_*.*
          if-no-files-found: error
          retention-days: 1

  build-on-rocky:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: rockylinux:9
      options: --user root
    env:
      CGO_ENABLED: "1"
      CC: gcc
      CXX: g++
    defaults:
      run:
        shell: bash

    steps:
      - name: Bootstrap Rocky
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make git ca-certificates tar gzip curl-minimal bsdtar

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Prepare datatool
        run: |
          mkdir -p .tmp/extracted tdx/embed
          curl -fsSL \
            https://www.tdx.com.cn/products/autoup/cyb/datatool.rar \
            -o .tmp/datatool.rar
          bsdtar -xf .tmp/datatool.rar -C .tmp/extracted
          install -m 0755 .tmp/extracted/v4/datatool tdx/embed/datatool

      - name: Verify toolchain
        run: |
          go version
          gcc --version | head -1
          ldd --version | head -1

      - name: Test
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          output=$(go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${DATE}" \
            -o tdx2db . 2>&1)
          status=$?
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output"
            message=$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-6000)
            printf '::error title=go build failed::%s\n' "$message"
            exit "$status"
          fi

      - name: Smoke test
        run: |
          ./tdx2db version

      - name: Inspect linkage
        run: |
          ldd ./tdx2db || true

      - name: Archive (tar.gz)
        run: |
          tar -czf tdx2db_Linux_arm64.tar.gz tdx2db

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-linux-arm64
          path: tdx2db_Linux_arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs:
      - build
      - build-on-rocky
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: archives
          pattern: archive-*
          merge-multiple: true

      - name: Determine pre-release
        id: prerel
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            archives/tdx2db_*.* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ${{ steps.prerel.outputs.flag }}
